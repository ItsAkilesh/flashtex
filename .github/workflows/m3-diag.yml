# TEMPORARY (lane M3-POLYGLOSSIA): one corpus case through latex.py with
# --keep, both engines' outputs uploaded for offline XDV diffing. Removed
# before the branch merges.
name: m3-diag

on:
  push:
    branches: ["agent/kabir-claude/m3-polyglossia"]
    paths: [".github/workflows/m3-diag.yml", "crates/flashtex-xetex/**", "tools/**"]

permissions:
  contents: read

concurrency:
  group: m3-diag-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  TEXLIVE_IMAGE: texlive/texlive@sha256:a7ae4dfa9d521b5db14446872fa488b839021d1f604d0a3c74461784895f2a67
  CASES: "polyglossia"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: results directory
        run: echo "OUT=$RUNNER_TEMP/m3" >> "$GITHUB_ENV"
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unicode-m3-linux
          save-if: "false"
          workspaces: |
            crates/flashtex-xetex -> target
      - name: build the port and fonts_line
        working-directory: crates/flashtex-xetex
        run: cargo build --release --locked --bin flashtex-xetex --example fonts_line
      - uses: ./.github/actions/texlive-2026
        id: tl
        with:
          image: ${{ env.TEXLIVE_IMAGE }}
          cache: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fonts by name for both engines
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig || true
          tl="$(dirname "$(dirname "${{ steps.tl.outputs.bin }}")")"
          cat > "$RUNNER_TEMP/fonts.conf" <<EOF
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <dir>$tl/texmf-dist/fonts/opentype</dir>
            <dir>$tl/texmf-dist/fonts/truetype</dir>
            <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
            <cachedir>$RUNNER_TEMP/fc-cache</cachedir>
          </fontconfig>
          EOF
          {
            echo "FONTCONFIG_FILE=$RUNNER_TEMP/fonts.conf"
            echo "FLASHTEX_FONT_DIRS=$tl/texmf-dist/fonts/opentype:$tl/texmf-dist/fonts/truetype"
            echo "FLASHTEX_CACHE_DIR=$RUNNER_TEMP/flashtex-cache"
          } >> "$GITHUB_ENV"
          FONTCONFIG_FILE="$RUNNER_TEMP/fonts.conf" fc-cache -f >/dev/null 2>&1 || true
          # the order fontconfig lists duplicates in, under this order and the old one
          echo "== texmf first"; FONTCONFIG_FILE="$RUNNER_TEMP/fonts.conf" fc-list "DejaVu Sans Mono:style=Bold" file || true
          cat > "$RUNNER_TEMP/fonts-old.conf" <<EOF
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
            <dir>$tl/texmf-dist/fonts/opentype</dir>
            <dir>$tl/texmf-dist/fonts/truetype</dir>
            <cachedir>$RUNNER_TEMP/fc-cache</cachedir>
          </fontconfig>
          EOF
          echo "== system first"; FONTCONFIG_FILE="$RUNNER_TEMP/fonts-old.conf" fc-list "DejaVu Sans Mono:style=Bold" file || true
      - name: assemble the corpus
        run: |
          set -euo pipefail
          python3 tools/unicode-m3/corpus.py assemble --out "$OUT/corpus" \
            --fonts-line crates/flashtex-xetex/target/release/examples/fonts_line --cache "$RUNNER_TEMP/corpus-cache"
      - name: the case, kept
        run: |
          set -o pipefail
          python3 tools/xetex-lockstep/latex.py --engine crates/flashtex-xetex/target/release/flashtex-xetex \
            --cases-dir "$OUT/corpus" --cases $CASES --jobs 1 --timeout 3600 --keep 2>&1 | tee "$OUT/diag.txt" || true
          kept="$(sed -n 's/^kept: //p' "$OUT/diag.txt")"
          mkdir -p "$OUT/kept"
          for c in $CASES; do
            for who in reference candidate; do
              mkdir -p "$OUT/kept/$c/$who"
              cp "$kept/$c/$who"/*.xdv "$OUT/kept/$c/$who/" 2>/dev/null || true
              cp "$kept/$c/$who"/*.tex "$OUT/kept/$c/$who/" 2>/dev/null || true
              cp "$kept/$c/$who/.stderr" "$OUT/kept/$c/$who/stderr.txt" 2>/dev/null || true
              # the traced log is large; keep it compressed
              for l in "$kept/$c/$who"/*.log; do gzip -c "$l" > "$OUT/kept/$c/$who/$(basename "$l").gz"; done
            done
          done
          du -sh "$OUT/kept"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-diag
          path: ${{ runner.temp }}/m3
          retention-days: 7
