[package]
name = "flashtex-unicode-tex"
version = "0.1.0"
edition = "2024"
description = "XeLaTeX/LuaLaTeX compatibility for FlashTeX: engine detection, fontspec and unicode-math option models, OpenType font lookup, TeX-ligature mapping, script-aware OpenType feature shaping and interword glue."
publish = false

[lib]
name = "flashtex_unicode_tex"
path = "src/lib.rs"

[dependencies]
# Font program parsing (cmap, hmtx, OS/2, post, MATH) comes from the sibling
# font engine; its optional consumer adapters are not needed here.
flashtex-font-engine = { path = "../font-engine", default-features = false }
