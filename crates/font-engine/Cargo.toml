[package]
name = "flashtex-font-engine"
version = "0.1.0"
edition = "2024"
description = "Original FlashTeX font engine: TrueType/OpenType parsing, Adobe Core 14 metrics, TeX-oriented shaping with source-byte clusters, deterministic subsetting, and PDF embedding data."
publish = false

[lib]
name = "flashtex_font_engine"
path = "src/lib.rs"

[features]
default = ["paragraph", "math", "pdf"]
# Adapters to sibling crates on main; each is a path dependency with no
# external crates behind it. Disable to build the engine alone.
paragraph = ["dep:flashtex-paragraph-layout"]
math = ["dep:flashtex-math-layout"]
pdf = ["dep:flashtex-pdf"]

[dependencies]
flashtex-paragraph-layout = { path = "../paragraph-layout", optional = true }
flashtex-math-layout = { path = "../math-layout", optional = true }
flashtex-pdf = { path = "../pdf", optional = true }

[dev-dependencies]
# font-resources is a real consumer of collection_layout (registry::collections
# requires an external VerifiedCollectionResolver); tests/consumer_integration.rs
# drives that trait through font-resources' own CollectionRegistry::load, not a
# stand-in. Dev-only, so this does not create a build cycle for normal builds
# (font-resources' own [dependencies] on this crate is unaffected).
flashtex-font-resources = { path = "../font-resources" }
flashtex-project-files = { path = "../project-files" }
serde_json = "1"
tempfile = "3"
