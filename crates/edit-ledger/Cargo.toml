[package]
name = "flashtex-edit-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Durable document and reviewed-edit transactions for FlashTeX native consumers"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
libc = "0.2"
