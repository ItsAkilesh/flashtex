[package]
name = "flashtex-document-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
flashtex-project-files = { path = "../project-files" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"
