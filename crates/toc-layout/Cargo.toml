[package]
name = "flashtex-toc-layout"
version = "0.1.0"
edition = "2024"
description = "Original FlashTeX table-of-contents / list-of-figures entry layout: explicit section/page records, measured dot leaders, and bounded revision-safe front-matter pagination convergence. No external crates."
publish = false

[lib]
name = "flashtex_toc_layout"
path = "src/lib.rs"

[dependencies]

# Real-producer integration fixture only (tests/); the library itself still
# has zero dependencies. See tests/support/mod.rs for the grep evidence that
# no other crate exposes prebuilt section/page records to consume instead.
[dev-dependencies]
flashtex-compiler = { path = "../compiler" }
