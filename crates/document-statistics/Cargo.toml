[package]
name = "flashtex-document-statistics"
version = "0.1.0"
edition = "2024"
description = "Bounded FlashTeX document statistics (words, math, pages) computed from explicit rendered items, bound exactly to a caller-supplied revision identity."
publish = false

[lib]
name = "flashtex_document_statistics"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# Test-only: the real, only document producer in this repository today (see
# tests/support/mod.rs). This crate's own src/ takes no dependency on the
# compiler -- see src/lib.rs's "no filesystem, no parsing" guarantee.
flashtex-compiler = { path = "../compiler" }
