[package]
name = "flashtex-paragraph-layout"
version = "0.1.0"
edition = "2024"
description = "Original FlashTeX paragraph line breaking (Knuth-Plass total-fit and first-fit), horizontal/vertical metrics, and deterministic page breaking behind an integration API. No external crates."
publish = false

[lib]
name = "flashtex_paragraph_layout"
path = "src/lib.rs"

[dependencies]
flashtex-document-style = { path = "../document-style" }

[dev-dependencies]
# Test-only: reads the Latin Modern OpenType faces for the LM route
# comparison (tests/oracle_lm_cm_default.rs). default-features = false keeps
# this a leaf dependency once the engine gains its paragraph adapter feature.
flashtex-font-engine = { path = "../font-engine", default-features = false }
