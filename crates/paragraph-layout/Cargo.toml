[package]
name = "flashtex-paragraph-layout"
version = "0.1.0"
edition = "2024"
description = "Original FlashTeX paragraph line breaking (Knuth-Plass total-fit and first-fit), horizontal/vertical metrics, and deterministic page breaking behind an integration API. No external crates."
publish = false

[lib]
name = "flashtex_paragraph_layout"
path = "src/lib.rs"

[dependencies]

# Dev-only: used exclusively by tests (FT-030 rev 3) to consume the real,
# already-published metrics/encoding callback (flashtex_font_engine's
# `adapters::paragraph::FaceMetrics`, implementing this crate's own
# `FontMetricsSource`) and to build a pinned break/position mismatch fixture
# against the real consumer (`flashtex_compiler`'s greedy layout). Neither
# crate is a dependency of the shipped library; both are sibling in-repo
# crates, not third-party. See coordination/daniel-tables.md.
[dev-dependencies]
flashtex-font-engine = { path = "../font-engine" }
flashtex-compiler = { path = "../compiler" }
