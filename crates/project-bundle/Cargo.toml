[package]
name = "flashtex-project-bundle"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Deterministic, explicitly-scoped project export bundle: rooted reads/writes via flashtex-project-files, a SHA-256 manifest with reproducible ordering, bounded import preview with typed no-clobber conflicts, and no implicit filesystem discovery."

[lib]
name = "flashtex_project_bundle"
path = "src/lib.rs"

[dependencies]
flashtex-project-files = { path = "../project-files" }
unicode-normalization = "0.1.25"

[dev-dependencies]
