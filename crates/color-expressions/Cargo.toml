[package]
name = "flashtex-color-expressions"
version = "0.1.0"
edition = "2024"
description = "Original bounded xcolor-style colour-expression parser: named-palette lookup, `-color` complement, and `a!p!b` mixing, resolving into flashtex-vector-graphics's Color/Paint. Standalone crate; not wired into the compiler."
publish = false

[lib]
name = "flashtex_color_expressions"
path = "src/lib.rs"

[dependencies]
flashtex-vector-graphics = { path = "../vector-graphics" }
