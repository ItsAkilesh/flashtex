[package]
name = "flashtex-rendering-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental typed display-list validation; not a production wire replacement"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dependencies.flashtex-font-resources]
path = "../font-resources"

[dev-dependencies]
flashtex-project-files = { path = "../project-files" }
flashtex-font-engine = { path = "../font-engine" }
tempfile = "3"

[dependencies.flashtex-pdf]
path = "../pdf"
