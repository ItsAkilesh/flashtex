[package]
name = "flashtex-assistant-context"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flashtex-edit-ledger = { path = "../edit-ledger" }
flashtex-project-files = { path = "../project-files" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
grok = ["dep:reqwest", "dep:flashtex-conversion-jobs"]

[dependencies.reqwest]
version = "0.12.28"
default-features = false
features = ["blocking", "json", "rustls-tls"]
optional = true

[dependencies.flashtex-conversion-jobs]
path = "../conversion-jobs"
optional = true
