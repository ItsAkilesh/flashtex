[package]
name = "flashtex-conversion-jobs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
bridge-integration = ["dep:flashtex-bridge", "dep:sha2", "dep:fs2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
flashtex-bridge = { path = "../bridge", optional = true }
sha2 = { version = "0.10", optional = true }
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
flashtex-edit-ledger = { path = "../edit-ledger" }
flashtex-bridge = { path = "../bridge" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"

[[example]]
name = "capture_pipeline"
test = true

[[bin]]
name = "flashtex-review-inbox"
path = "src/bin/review_inbox.rs"
required-features = ["bridge-integration"]
