[package]
name = "flashtex-conversion-jobs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
flashtex-bridge = { path = "../bridge" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"

[[example]]
name = "capture_pipeline"
test = true
